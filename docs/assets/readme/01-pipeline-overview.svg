<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" rx="32" fill="#0F172A"/>
  <text x="72" y="86" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="42" font-weight="700">YouTube Shorts 자동화 운영 파이프라인</text>
  <text x="74" y="126" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">데이터 준비 → 콘텐츠 생성 → 영상 렌더링 → 예약 업로드 → 상태 검증 → 복구 큐</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12 Z" fill="#38BDF8"/>
    </marker>
  </defs>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="170" height="118" rx="22" fill="#1E293B" stroke="#334155"/>
    <text x="155" y="238" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">데이터</text>
    <text x="155" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">CSV/JSON</text>
    <text x="155" y="294" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">후보 보충</text>

    <rect x="290" y="190" width="170" height="118" rx="22" fill="#1E293B" stroke="#334155"/>
    <text x="375" y="238" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">생성</text>
    <text x="375" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">단어/문법</text>
    <text x="375" y="294" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">TTS/스크립트</text>

    <rect x="510" y="190" width="170" height="118" rx="22" fill="#1E293B" stroke="#334155"/>
    <text x="595" y="238" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">렌더링</text>
    <text x="595" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">영상/썸네일</text>
    <text x="595" y="294" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">모바일 화면</text>

    <rect x="730" y="190" width="170" height="118" rx="22" fill="#1E293B" stroke="#334155"/>
    <text x="815" y="238" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">업로드</text>
    <text x="815" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">YouTube</text>
    <text x="815" y="294" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">공개/예약</text>

    <rect x="950" y="190" width="170" height="118" rx="22" fill="#1E293B" stroke="#334155"/>
    <text x="1035" y="238" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">검증</text>
    <text x="1035" y="270" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">상태 확인</text>
    <text x="1035" y="294" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">복구 큐</text>
  </g>

  <path d="M248 249 H280" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M468 249 H500" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M688 249 H720" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M908 249 H940" stroke="#38BDF8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="96" y="390" width="1088" height="180" rx="26" fill="#111827" stroke="#334155"/>
  <text x="130" y="438" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="700">운영 포인트</text>
  <text x="130" y="482" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">• JLPT N1~N5, BUSINESS, Kanji, TOPIK/TOPIK ES 등 채널별 생성·업로드 흐름 분리</text>
  <text x="130" y="518" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">• 후보 데이터 부족, OAuth 만료, YouTube 제한, 썸네일/재생목록 경고를 단계별로 구분</text>
  <text x="130" y="554" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="20">• 실패 시 스킵하지 않고 영상·썸네일·로그를 보존한 뒤 복구 큐와 상태 파일로 재처리</text>

  <rect x="72" y="625" width="420" height="44" rx="22" fill="#0EA5E9" fill-opacity="0.16" stroke="#38BDF8"/>
  <text x="282" y="654" fill="#BAE6FD" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Portfolio README Asset</text>
</svg>
